# Render Blueprint for RouteDiscover (https://render.com/docs/blueprint-spec)
# Creates the web service and a Postgres database. After the first deploy:
#   1. Add the custom domains routediscover.com and www.routediscover.com to the
#      web service (Render issues the TLS certificate automatically).
#   2. At GoDaddy, point DNS at Render (see README → Deploying).
#   3. Set APP_SECRET (generated below) and open https://routediscover.com to
#      create the first account, which becomes the owner.
services:
  - type: web
    name: routediscover
    runtime: node
    plan: starter
    region: ohio
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/stats/public
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_PUBLIC_SITE_URL
        value: https://routediscover.com
      - key: DATABASE_URL
        fromDatabase:
          name: routediscover-db
          property: connectionString
      - key: APP_SECRET
        generateValue: true
      - key: ROUTEDISCOVER_DATA_MODE
        value: auto
      # Optional: can also be entered in the owner console (Integrations)
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: OPENCHARGEMAP_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false

databases:
  - name: routediscover-db
    plan: basic-256mb
    region: ohio
    postgresMajorVersion: "16"
